<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simulado — ENEM Study</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="data.js"></script>
  <script defer src="simulado.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Simulado ENEM — Protótipo</h1>
      <p class="muted">Escolha número de questões e duração; o simulado roda no navegador.</p>
    </div>
  </header>

  <main class="container">
    <div id="config" class="card">
      <label>Número de questões <input id="count" type="number" value="10" min="1" max="50" /></label>
      <label style="margin-left:12px">Duração (min) <input id="minutes" type="number" value="90" min="1" max="300" /></label>
      <div style="margin-top:12px">
        <button id="start" class="btn">Iniciar simulado</button>
        <a href="index.html" class="btn" style="background:#6b7280;margin-left:8px">Voltar</a>
      </div>
    </div>

    <div id="sim" hidden></div>
    <div id="result" hidden></div>
  </main>

  <footer class="site-footer"><div class="container">Protótipo — resultados não são salvos (local somente).</div></footer>
</body>
</html>
